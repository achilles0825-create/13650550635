<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>養貓貓單檔完整版 Demo</title>
    <style>
        :root{
            --bg:#F7F6F2;
            --panel:#FFFFFF;
            --muted:#9AA3A8;
            --accent:#FF8A65;
            --good:#66BB6A;
            --danger:#EF5350;
            --glass: rgba(255,255,255,0.7);
            font-family: "Noto Sans TC", "Segoe UI", Roboto, Arial, sans-serif;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            padding:24px;
            background:linear-gradient(180deg,#FDFDFD 0%,var(--bg) 100%);
            color:#20343A;
        }
        .container{
            max-width:1100px;
            margin:0 auto;
            display:grid;
            grid-template-columns: 360px 1fr 300px;
            gap:18px;
            align-items:start;
        }
        .card{
            background:var(--panel);
            border-radius:12px;
            box-shadow:0 6px 18px rgba(32,52,58,0.06);
            padding:16px;
        }
        /* Left: Profile / Stats */
        .profile{
            text-align:center;
        }
        .cat-image{
            width:220px;
            height:220px;
            margin:0 auto 8px;
            border-radius:16px;
            background:linear-gradient(135deg,#FFF 0%,#F3F3F3 100%);
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            border:4px solid rgba(0,0,0,0.03);
        }
        .cat-image img{width:100%;height:100%;object-fit:cover}
        h2{margin:8px 0 4px;font-size:20px}
        .level-badge{
            display:inline-block;
            margin-top:6px;
            padding:6px 10px;
            background:linear-gradient(90deg,var(--accent),#FFB199);
            color:#fff;border-radius:999px;font-weight:700;font-size:13px;
            box-shadow:0 4px 10px rgba(255,138,101,0.18);
        }
        .stats{margin-top:12px;text-align:left}
        .stat{
            display:flex;align-items:center;justify-content:space-between;margin:8px 0;
        }
        .stat .bar{
            height:12px;background:linear-gradient(90deg,#EEE,#F7F7F7);border-radius:999px;flex:1;margin-left:10px;margin-right:10px;overflow:hidden;
        }
        .stat .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#FFCCBA);transition: width 0.2s ease;}
        .small{font-size:13px;color:var(--muted)}
        /* Center: Actions + log */
        .actions{
            display:flex;flex-direction:column;gap:12px;
        }
        .row{display:flex;gap:12px}
        .btn{
            background:var(--accent);
            color:#fff;padding:10px 12px;border-radius:10px;border:0;font-weight:700;cursor:pointer;
            box-shadow:0 6px 12px rgba(255,138,101,0.12);
        }
        .btn.secondary{background:#6C9AA0}
        .btn.ghost{background:transparent;color:var(--accent);border:2px solid rgba(255,138,101,0.12)}
        .inventory{display:flex;gap:8px;flex-wrap:wrap}
        .item{
            background:#FBFBFB;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;width:110px;
            box-shadow:0 4px 10px rgba(32,52,58,0.04);
        }
        .item .name{font-weight:700;margin-top:6px;font-size:13px}
        .log{height:220px;overflow:auto;background:linear-gradient(180deg,#FFF,#FAFAFA);padding:10px;border-radius:8px}
        .log p{margin:6px 0;font-size:13px; border-bottom: 1px dashed #EEE; padding-bottom: 4px;}
        /* Right: Shop & Social */
        .shop .row{margin-bottom:8px}
        .currency{display:flex;gap:10px;align-items:center;justify-content:flex-end}
        .chip{background:#FFF;border-radius:999px;padding:8px 10px;border:1px solid rgba(0,0,0,0.04);font-weight:700}
        .friends{display:flex;flex-direction:column;gap:8px;margin-top:10px}
        .friend{
            display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px;border-radius:8px;background:linear-gradient(180deg,#FFF,#FBFBFB)
        }
        .small-muted{font-size:12px;color:var(--muted)}
        footer{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}
        /* Responsive */
        @media (max-width:980px){
            .container{grid-template-columns:1fr; padding:12px}
            .cat-image{width:180px;height:180px}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card profile">
            <div class="cat-image" id="catImage">
                <img id="catImg" src="https://chateverywhere.app/static/img/cat-placeholder.png" alt="貓咪">
            </div>
            <h2 id="catName">小貓咪</h2>
            <div class="level-badge" id="levelBadge">Lv. 1</div>

            <div class="stats">
                <div class="stat"><div class="small">飽食度</div><div style="width:65%"><div class="bar"><i id="barHunger" style="width:70%"></i></div></div><div class="small" id="valHunger">70</div></div>
                <div class="stat"><div class="small">快樂</div><div style="width:65%"><div class="bar"><i id="barHappy" style="width:60%"></i></div></div><div class="small" id="valHappy">60</div></div>
                <div class="stat"><div class="small">清潔</div><div style="width:65%"><div class="bar"><i id="barClean" style="width:80%"></i></div></div><div class="small" id="valClean">80</div></div>
                <div class="stat"><div class="small">能量</div><div style="width:65%"><div class="bar"><i id="barEnergy" style="width:80%"></i></div></div><div class="small" id="valEnergy">80</div></div>
                <div class="stat"><div class="small">親密</div><div style="width:65%"><div class="bar"><i id="barBond" style="width:10%"></i></div></div><div class="small" id="valBond">0</div></div>
                <div class="stat"><div class="small">等級 / XP</div><div style="width:65%"><div class="bar"><i id="barXP" style="width:0%"></i></div></div><div class="small" id="valXP">0 / 100</div></div>
            </div>
        </div>

        <div class="card actions">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <span class="small-muted">當前節奏：</span>
                    <span style="font-weight:700" id="paceLabel">中度</span>
                </div>
                <div>
                    <button class="btn ghost" id="saveBtn">儲存</button>
                    <button class="btn secondary" id="resetBtn">重置</button>
                </div>
            </div>

            <div class="row">
                <div style="flex:1">
                    <div class="small-muted" style="margin-bottom:8px;">道具庫</div>
                    <div class="inventory" id="inventory">
                        </div>
                </div>
                <div style="width:220px">
                    <div class="small-muted">快速行為</div>
                    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
                        <button class="btn" id="feedBtn">餵普通食物</button>
                        <button class="btn ghost" id="feedHighBtn">餵高級食物</button>
                        <button class="btn secondary" id="playBtn">陪玩（minigame）</button>
                        <button class="btn" id="cleanBtn">洗澡</button>
                        <button class="btn ghost" id="dryCleanBtn">乾洗</button>
                        <button class="btn secondary" id="sleepBtn">睡覺（快速回復）</button>
                        <button class="btn" id="trainBtn">訓練（提升 XP）</button>
                    </div>
                </div>
            </div>

            <h3 style="margin-top:12px; margin-bottom:4px;">活動紀錄</h3>
            <div class="log" id="log"></div>
        </div>

        <div class="card shop">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div class="small-muted">貨幣</div>
                    <div style="margin-top:6px">
                        <span class="chip">Coins: <span id="coins">200</span></span>
                        <span class="chip">Gems: <span id="gems">5</span></span>
                    </div>
                </div>
            </div>

            <div style="margin-top:12px">
                <div class="small-muted">商店</div>
                <div class="row" style="margin-top:8px">
                    <div class="item">
                        <div style="height:46px;width:46px;background:#FFF;border-radius:8px;display:flex;align-items:center;justify-content:center">🍗</div>
                        <div class="name">普通食物</div>
                        <div class="small-muted">Coins 10</div>
                        <button class="btn ghost" style="margin-top:6px; padding:4px 8px;" data-buy="food_common">購買</button>
                    </div>
                    <div class="item">
                        <div style="height:46px;width:46px;background:#FFF;border-radius:8px;display:flex;align-items:center;justify-content:center">🍖</div>
                        <div class="name">高級食物</div>
                        <div class="small-muted">Coins 50</div>
                        <button class="btn ghost" style="margin-top:6px; padding:4px 8px;" data-buy="food_high">購買</button>
                    </div>
                </div>
                <div class="row" style="margin-top:8px">
                    <div class="item">
                        <div style="height:46px;width:46px;background:#FFF;border-radius:8px;display:flex;align-items:center;justify-content:center">🧸</div>
                        <div class="name">玩具</div>
                        <div class="small-muted">Coins 30</div>
                        <button class="btn ghost" style="margin-top:6px; padding:4px 8px;" data-buy="toy">購買</button>
                    </div>
                    <div class="item">
                        <div style="height:46px;width:46px;background:#FFF;border-radius:8px;display:flex;align-items:center;justify-content:center">🛁</div>
                        <div class="name">乾洗用品</div>
                        <div class="small-muted">Coins 15</div>
                        <button class="btn ghost" style="margin-top:6px; padding:4px 8px;" data-buy="dry_clean">購買</button>
                    </div>
                </div>
            </div>

            <div style="margin-top:12px">
                <div class="small-muted">好友</div>
                <div class="friends" id="friendsList">
                    </div>
                <div style="margin-top:8px;display:flex;gap:8px">
                    <input id="friendName" placeholder="好友名稱" style="flex:1;padding:8px;border-radius:8px;border:1px solid #EEE"/>
                    <button class="btn ghost" id="addFriendBtn">加好友</button>
                </div>
            </div>

            <footer>示範版 — 可替換貓圖片與數值</footer>
        </div>
    </div>

    <script>
        /***************
         * Settings
         ***************/
        const settings = {
            pace: 'medium',
            decay: {
                easy: { hunger: 0.02, happiness: 0.01, cleanliness: 0.005, energy: 0.02 },
                medium: { hunger: 0.05, happiness: 0.02, cleanliness: 0.01, energy: 0.04 },
                hard: { hunger: 0.12, happiness: 0.05, cleanliness: 0.03, energy: 0.12 }
            },
            actions: {
                feed_common: { coins:10, hunger:20, happy:5, xp:10 },
                feed_high: { coins:50, hunger:45, happy:20, xp:30, bond:5 },
                toy_play: { cost:0, energy:-15, happy:25, xp:20, bond:8 },
                bath: { coins:20, clean:60, happy:-5, xp:15 },
                dry_clean: { coins:15, clean:30, happy:2, xp:8 },
                sleep: { energy:40, hunger:-5, happy:5 },
                train: { coins:0, energy:-20, xp:40, happy:8 }
            },
            xpCurve: (L) => Math.floor(100 * Math.pow(L,1.2))
        };

        /***************
         * Game State
         ***************/
        const defaultState = {
            name: "小貓咪",
            level:1, xp:0,
            hunger:70, happiness:60, cleanliness:80, energy:80, bond:0,
            coins:200, gems:5,
            inventory: { food_common:1, food_high:0, toy:1, dry_clean:1 },
            friends: [{name:'阿花', petName:'花花', bond:120},{name:'小明',petName:'米奇',bond:40}],
            log: []
        };

        let state = loadState();

        // apply pace label
        document.getElementById('paceLabel').innerText = settings.pace === 'easy' ? '輕鬆' : settings.pace === 'hard' ? '高黏著' : '中度';

        /***************
         * Helpers
         ***************/
        function saveState(){
            localStorage.setItem('cat_state_v1', JSON.stringify(state));
        }
        function loadState(){
            const raw = localStorage.getItem('cat_state_v1');
            if(raw) {
                try { return JSON.parse(raw); } catch(e){ console.error(e); }
            }
            return JSON.parse(JSON.stringify(defaultState));
        }
        function resetState(){
            if(confirm('確認要重置進度嗎？')) {
                state = JSON.parse(JSON.stringify(defaultState));
                saveState();
                renderAll();
                logAdd('遊戲已重置');
            }
        }
        function clamp(v,min=0,max=100){ return Math.max(min,Math.min(max,v)); }
        function logAdd(text){
            const t = `[${new Date().toLocaleTimeString()}] ${text}`;
            state.log.unshift(t);
            if(state.log.length>200) state.log.pop();
            renderLog();
            saveState();
        }
        function toast(msg){
            const el = document.createElement('div');
            el.style.position='fixed';el.style.right='20px';el.style.bottom='20px';
            el.style.background='rgba(32,52,58,0.92)';el.style.color='#fff';el.style.padding='10px 14px';
            el.style.borderRadius='8px';el.style.zIndex=9999;el.style.fontWeight=700;
            el.innerText=msg;document.body.appendChild(el);
            setTimeout(()=>el.remove(),1400);
        }

        /***************
         * Render
         ***************/
        function renderAll(){
            document.getElementById('catName').innerText = state.name;
            document.getElementById('levelBadge').innerText = `Lv. ${state.level}`;
            document.getElementById('barHunger').style.width = state.hunger+'%';
            document.getElementById('barHappy').style.width = state.happiness+'%';
            document.getElementById('barClean').style.width = state.cleanliness+'%';
            document.getElementById('barEnergy').style.width = state.energy+'%';
            document.getElementById('barBond').style.width = Math.min(100, state.bond/10)+'%';
            
            const xpToNext = settings.xpCurve(state.level);
            document.getElementById('barXP').style.width = Math.min(100, Math.floor(state.xp/xpToNext*100))+'%';
            
            document.getElementById('valHunger').innerText = Math.floor(state.hunger);
            document.getElementById('valHappy').innerText = Math.floor(state.happiness);
            document.getElementById('valClean').innerText = Math.floor(state.cleanliness);
            document.getElementById('valEnergy').innerText = Math.floor(state.energy);
            document.getElementById('valBond').innerText = Math.floor(state.bond);
            document.getElementById('valXP').innerText = `${state.xp} / ${xpToNext}`;
            document.getElementById('coins').innerText = state.coins;
            document.getElementById('gems').innerText = state.gems;
            renderInventory();
            renderFriends();
        }

        function renderInventory(){
            const inv = document.getElementById('inventory');
            inv.innerHTML = '';
            const map = {
                food_common: {icon:'🍗',name:'普通食物'},
                food_high: {icon:'🍖',name:'高級食物'},
                toy: {icon:'🧸',name:'玩具'},
                dry_clean: {icon:'🛁',name:'乾洗用品'}
            };
            for(const key of Object.keys(map)){
                const count = state.inventory[key] || 0;
                const div = document.createElement('div');
                div.className='item';
                div.innerHTML = `<div style="height:46px;width:46px;background:#FFF;border-radius:8px;display:flex;align-items:center;justify-content:center">${map[key].icon}</div>
                <div class="name">${map[key].name}</div>
                <div class="small-muted">x ${count}</div>
                <div style="margin-top:8px"><button class="btn ghost" style="padding:4px 8px; font-size:12px;" data-use="${key}">使用</button></div>`;
                inv.appendChild(div);
            }
            inv.querySelectorAll('[data-use]').forEach(b=>{
                b.addEventListener('click',(e)=>{
                    const key = e.currentTarget.getAttribute('data-use');
                    useItem(key);
                });
            });
        }

        function renderFriends(){
            const el = document.getElementById('friendsList');
            el.innerHTML = '';
            state.friends.forEach((f,idx)=>{
                const div = document.createElement('div');
                div.className='friend';
                div.innerHTML = `<div style="display:flex;gap:10px;align-items:center">
                    <div style="width:44px;height:44px;border-radius:8px;background:#FFF;display:flex;align-items:center;justify-content:center">🐱</div>
                    <div style="min-width:0">
                        <div style="font-weight:700">${f.name}</div>
                        <div class="small-muted">貓：${f.petName} • 親密 ${f.bond}</div>
                    </div>
                </div>
                <div style="display:flex;gap:6px">
                    <button class="btn ghost" style="padding:4px 8px; font-size:12px;" data-visit="${idx}">訪問</button>
                    <button class="btn secondary" style="padding:4px 8px; font-size:12px;" data-gift="${idx}">送禮</button>
                </div>`;
                el.appendChild(div);
            });
            el.querySelectorAll('[data-visit]').forEach(b=>b.addEventListener('click', (e)=>{
                const idx = parseInt(e.currentTarget.getAttribute('data-visit'));
                visitFriend(idx);
            }));
            el.querySelectorAll('[data-gift]').forEach(b=>b.addEventListener('click', (e)=>{
                const idx = parseInt(e.currentTarget.getAttribute('data-gift'));
                giftFriend(idx);
            }));
        }

        function renderLog(){
            const el = document.getElementById('log');
            el.innerHTML = '';
            state.log.slice(0,80).forEach(p=>{
                const pp = document.createElement('p'); pp.innerText = p; el.appendChild(pp);
            });
        }

        /***************
         * Actions
         ***************/
        function applyActionEffects(effects){
            if(effects.coins) state.coins = Math.max(0, state.coins - effects.coins);
            if(effects.gems) state.gems = Math.max(0, state.gems - effects.gems);
            if(effects.hunger) state.hunger = clamp(state.hunger + effects.hunger);
            if(effects.happy) state.happiness = clamp(state.happiness + effects.happy);
            if(effects.clean) state.cleanliness = clamp(state.cleanliness + effects.clean);
            if(effects.energy) state.energy = clamp(state.energy + effects.energy);
            if(effects.xp) addXP(effects.xp);
            if(effects.bond) state.bond = clamp(state.bond + effects.bond,0,1000);
            renderAll();
            saveState();
        }

        function addXP(amount){
            state.xp += amount;
            while(state.xp >= settings.xpCurve(state.level)){
                state.xp -= settings.xpCurve(state.level);
                state.level += 1;
                state.coins += 50;
                state.energy = clamp(state.energy + 10);
                logAdd(`等級提升！現在 Lv. ${state.level}，獲得 50 Coins 與 +10 能量`);
            }
        }

        function feed(type){
            if(type==='common'){
                if(state.inventory.food_common > 0){
                    state.inventory.food_common--;
                    applyActionEffects(settings.actions.feed_common);
                    logAdd('使用普通食物餵食，飽食度提升');
                } else if(state.coins >= settings.actions.feed_common.coins){
                    state.coins -= settings.actions.feed_common.coins;
                    applyActionEffects(settings.actions.feed_common);
                    logAdd('購買並食用普通食物');
                } else { toast('Coins 不足'); }
            } else {
                if(state.inventory.food_high > 0){
                    state.inventory.food_high--;
                    applyActionEffects(settings.actions.feed_high);
                    logAdd('使用高級食物餵食，親密提升');
                } else if(state.coins >= settings.actions.feed_high.coins){
                    state.coins -= settings.actions.feed_high.coins;
                    applyActionEffects(settings.actions.feed_high);
                    logAdd('購買並食用高級食物');
                } else { toast('Coins 不足'); }
            }
        }

        function useItem(key){
            if((state.inventory[key] || 0) <= 0){ toast('道具不足'); return; }
            state.inventory[key]--;
            if(key==='toy'){
                applyActionEffects(settings.actions.toy_play);
                logAdd('用玩具陪玩，親密提升');
            } else if(key==='dry_clean'){
                applyActionEffects(settings.actions.dry_clean);
                logAdd('使用乾洗用品，清潔提升');
            } else if(key==='food_common'){
                applyActionEffects(settings.actions.feed_common);
                logAdd('使用普通食物餵食');
            } else if(key==='food_high'){
                applyActionEffects(settings.actions.feed_high);
                logAdd('使用高級食物餵食');
            }
        }

        function playMinigame(){
            if(state.energy < 15){ toast('能量不足，請讓貓咪休息'); return; }
            const score = Math.floor(Math.random()*100)+1;
            let bonusXP = Math.floor(score/5);
            applyActionEffects({ energy: settings.actions.toy_play.energy, happy: settings.actions.toy_play.happy, xp: settings.actions.toy_play.xp + bonusXP, bond: settings.actions.toy_play.bond });
            logAdd(`陪玩 minigame 得分 ${score}，獲得 ${settings.actions.toy_play.xp+bonusXP} XP`);
        }

        function bath(){
            if(state.coins < settings.actions.bath.coins){ toast('Coins 不足'); return; }
            applyActionEffects(settings.actions.bath);
            logAdd('洗澡完成，清潔提升但貓咪有點不高興');
        }

        /***************
         * Clean & Sleep & Train
         ***************/
        function dryClean(){
            if(state.inventory.dry_clean > 0){
                state.inventory.dry_clean--;
                applyActionEffects(settings.actions.dry_clean);
                logAdd('使用乾洗用品，清潔提升');
            } else if(state.coins >= settings.actions.dry_clean.coins){
                state.coins -= settings.actions.dry_clean.coins;
                applyActionEffects(settings.actions.dry_clean);
                logAdd('購買並使用乾洗用品');
            } else { toast('Coins 不足'); }
        }

        function sleepQuick(){
            applyActionEffects(settings.actions.sleep);
            logAdd('貓咪小睡一會兒，能量回復');
        }

        function train(){
            if(state.energy < 20){ toast('能量不足'); return; }
            applyActionEffects(settings.actions.train);
            logAdd('訓練完成，獲得大量 XP');
        }

        /***************
         * Social
         ***************/
        function addFriend(){
            const name = document.getElementById('friendName').value.trim();
            if(!name) { toast('請輸入名稱'); return; }
            state.friends.push({name: name, petName: name+'的貓', bond: 10});
            document.getElementById('friendName').value='';
            renderFriends();
            logAdd(`已新增好友：${name}`);
        }

        function visitFriend(idx){
            const f = state.friends[idx];
            const coins = 10; const xp = 10;
            state.coins += coins; addXP(xp);
            logAdd(`訪問 ${f.name} 完成，獲得 ${coins} Coins 與 ${xp} XP`);
        }

        function giftFriend(idx){
            const f = state.friends[idx];
            if(state.inventory.food_common>0){
                state.inventory.food_common--;
                f.bond = Math.min(1000, f.bond + 8);
                state.bond = clamp(state.bond + 5);
                logAdd(`送出普通食物給 ${f.name}，彼此親密提升`);
                renderAll();
            } else {
                toast('沒有可贈送的道具（需要普通食物）');
            }
        }

        /***************
         * Shop
         ***************/
        function buyItem(key){
            const priceMap = { food_common:10, food_high:50, toy:30, dry_clean:15 };
            const price = priceMap[key] || 0;
            if(state.coins < price){ toast('Coins 不足'); return; }
            state.coins -= price;
            state.inventory[key] = (state.inventory[key]||0) + 1;
            logAdd(`購買 ${key} x1`);
            renderAll();
        }

        /***************
         * Decay loop
         ***************/
        let lastTick = Date.now();
        function tick(){
            const now = Date.now();
            const dt = (now - lastTick)/1000; // 轉為秒數
            lastTick = now;
            
            const pace = settings.pace === 'easy' ? 'easy' : settings.pace === 'hard' ? 'hard' : 'medium';
            const d = settings.decay[pace];
            
            state.hunger = clamp(state.hunger - d.hunger * dt);
            
            let hapDecay = d.happiness * dt;
            if(state.hunger < 30 || state.cleanliness < 30) hapDecay *= 2;
            state.happiness = clamp(state.happiness - hapDecay);
            
            state.cleanliness = clamp(state.cleanliness - d.cleanliness * dt);
            state.energy = clamp(state.energy - d.energy * dt);
            
            if(state.hunger < 10){ state.happiness = clamp(state.happiness - 0.05 * dt); }
            
            // 每隔一段時間隨機觸發背景靜態存檔
            if(Math.random() < 0.05) saveState();
            
            renderAll();
        }
        setInterval(tick, 1000);

        /***************
         * Events Binding
         ***************/
        document.getElementById('feedBtn').addEventListener('click', ()=>feed('common'));
        document.getElementById('feedHighBtn').addEventListener('click', ()=>feed('high'));
        document.getElementById('playBtn').addEventListener('click', playMinigame);
        document.getElementById('cleanBtn').addEventListener('click', bath);
        document.getElementById('dryCleanBtn').addEventListener('click', dryClean);
        document.getElementById('sleepBtn').addEventListener('click', sleepQuick);
        document.getElementById('trainBtn').addEventListener('click', train);
        document.getElementById('saveBtn').addEventListener('click', ()=>{ saveState(); toast('已手動儲存進度!'); });
        document.getElementById('resetBtn').addEventListener('click', resetState);
        document.getElementById('addFriendBtn').addEventListener('click', addFriend);
        document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',(e)=>buyItem(e.currentTarget.getAttribute('data-buy'))));

        // 初始渲染與紀錄
        renderAll();
        renderLog();
        logAdd('遊戲開始 — 歡迎回到貓咪世界！');
    </script>
</body>
</html>
